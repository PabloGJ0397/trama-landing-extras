<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trama · cabecera</title>
  <!-- Tipografía del logo (Dela Gothic One) desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block" rel="stylesheet">
  <style>
    /* La cabecera ocupa todo el recuadro (iframe) en el que se incruste */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F0E6; }
    svg { display: block; width: 100%; height: 100%; }

    /* Elementos sobre los que se puede pulsar */
    .clicable { cursor: pointer; }

    /* Transición suave al resaltar / apagar hilos */
    .capa { transition: opacity .35s ease; }

    /* Botón «Tejer de nuevo» y texto de ayuda, abajo */
    .ui {
      position: absolute; bottom: 12px;
      font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1A1A1A;
    }
    #replay {
      right: 12px; padding: 7px 12px; cursor: pointer;
      background: #F5F0E6; border: 1.5px solid #1A1A1A; border-radius: 999px;
    }
    /* Fondo de papel para que el texto se lea aunque pase un hilo por detrás */
    #ayuda { padding: 6px 10px; background: rgba(245,240,230,.92); border-radius: 999px; }
    #replay:hover { background: #1A1A1A; color: #F5F0E6; }
    #ayuda { left: 10px; color: #555; }
    @media (max-width: 520px) { #ayuda { display: none; } }
  </style>
</head>
<body>
  <svg id="lienzo" viewBox="0 0 680 500" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Logotipo de Trama: hilos de colores que se unen en alianzas y confluyen en un tejido con la palabra TRAMA">
  </svg>
  <span class="ui" id="ayuda">Pulsa un colectivo o un botón para ver sus alianzas</span>
  <button class="ui" id="replay" type="button">↻ Tejer de nuevo</button>

<script>
/* =========================================================================
   1. CONFIGURACIÓN
   Para cambiar la paleta, basta con tocar los valores de COLORES.
   ========================================================================= */
const COLORES = {
  morado:  '#7A3FC4', verde:   '#2E9E5B', naranja: '#F28C28', rojo:    '#E63946',
  azul:    '#2B59C3', celeste: '#4FC3E8', fucsia:  '#E0218A', lima:    '#8BC53F',
  mostaza: '#F5C518', turquesa:'#12A89D',
  tinta:   '#1A1A1A', papel:   '#F5F0E6', boton:   '#EDE4D0', fondoTejido: '#241E2A'
};
// Hilos claros que se cruzan con los de color dentro del tejido del logo
const CLAROS = [COLORES.papel, '#F6B5CF', '#BFA8E8', '#FFE9A8', '#9ED8EE', '#F8C8A0', '#BFE6C4'];

// Respeta a quien tiene desactivadas las animaciones en su sistema
const SIN_ANIMACION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* -------------------------------------------------------------------------
   Datos de la composición.
   Cada colectivo es un hilo (curva Bézier cúbica: 4 puntos x,y) que entra
   desde fuera de la pantalla. «tr» es en qué punto del hilo va su zurcido
   y «al» es la alianza (botón) a la que llega; null = va directo al logo.
   ------------------------------------------------------------------------- */
const C = COLORES;
const COLECTIVOS = [
  { id:'k1',  color:C.morado,   curva:[-20,60, 60,50, 120,130, 160,130],   tr:.28, zurcido:'espiral', al:'a1' },
  { id:'k2',  color:C.fucsia,   curva:[-20,200, 60,200, 120,130, 160,130], tr:.28, zurcido:'sol',     al:'a1' },
  { id:'k3',  color:C.celeste,  curva:[-20,330, 60,340, 110,370, 150,370], tr:.28, zurcido:'anillos', al:'a2' },
  { id:'k4',  color:C.naranja,  curva:[40,520, 60,450, 110,390, 150,370],  tr:.30, zurcido:'rejilla', al:'a2' },
  { id:'k5',  color:C.turquesa, curva:[200,520, 190,450, 160,400, 150,370],tr:.30, zurcido:'espiral', al:'a2' },
  { id:'k6',  color:C.verde,    curva:[700,50, 620,40, 560,150, 520,150],  tr:.28, zurcido:'sol',     al:'a3' },
  { id:'k7',  color:C.azul,     curva:[700,130, 620,130, 570,150, 520,150],tr:.28, zurcido:'anillos', al:'a3' },
  { id:'k8',  color:C.mostaza,  curva:[700,215, 620,210, 570,160, 520,150],tr:.28, zurcido:'rejilla', al:'a3' },
  { id:'k9',  color:C.fucsia,   curva:[560,-20, 545,60, 530,110, 520,150], tr:.30, zurcido:'espiral', al:'a3' },
  { id:'k10', color:C.rojo,     curva:[700,430, 620,420, 590,370, 540,370],tr:.28, zurcido:'sol',     al:'a4' },
  { id:'k11', color:C.lima,     curva:[620,520, 600,450, 570,390, 540,370],tr:.30, zurcido:'anillos', al:'a4' },
  { id:'k12', color:C.mostaza,  curva:[300,-20, 255,60, 385,120, 325,215], tr:.20, zurcido:'rejilla', al:null },
  { id:'k13', color:C.turquesa, curva:[330,520, 320,450, 350,370, 340,280],tr:.20, zurcido:'sol',     al:null }
];
/* Alianzas: botón cosido (X = 2 hilos, ✱ = 3, # = 4) y cómo siguen los hilos
   hasta el logo: «paralelo» (alianza puntual) o «trenza» (fusión). */
const ALIANZAS = {
  a1: { pos:[160,130], tipo:'x',    angulos:[45,135],     sigue:'paralelo', curva:[160,130, 215,130, 225,215, 262,240] },
  a2: { pos:[150,370], tipo:'x3',   angulos:[90,30,150],  sigue:'trenza', vueltas:3,   curva:[150,370, 200,370, 240,320, 285,280] },
  a3: { pos:[520,150], tipo:'#',                          sigue:'trenza', vueltas:2.5, curva:[520,150, 480,150, 440,205, 400,225] },
  a4: { pos:[540,370], tipo:'x',    angulos:[45,135],     sigue:'paralelo', curva:[540,370, 490,370, 440,310, 372,283] }
};
// Colores de cada alianza = colores de los colectivos que llegan a ella
for (const k in ALIANZAS) ALIANZAS[k].colores = COLECTIVOS.filter(c => c.al === k).map(c => c.color);

// Tiempos de la animación (en milisegundos)
const T = { inicio: 150, escalonado: 60, hilo: 1150, alianza: 600, tejido: 650, etiqueta: 450 };

/* =========================================================================
   2. UTILIDADES DE DIBUJO
   ========================================================================= */
const NS = 'http://www.w3.org/2000/svg';
const lienzo = document.getElementById('lienzo');
const SUF = Math.random().toString(36).slice(2, 7);   // sufijo para ids únicos
let defs;

// Crea un elemento SVG con sus atributos y lo cuelga de «padre»
function el(tipo, attrs, padre) {
  const e = document.createElementNS(NS, tipo);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (padre || lienzo).appendChild(e);
  return e;
}
// Aclara u oscurece un color hex (a = 0..1) para los tonos de los zurcidos
function mezcla(hex, haciaBlanco, a) {
  const n = parseInt(hex.slice(1), 16), obj = haciaBlanco ? 255 : 0;
  const rgb = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v + (obj - v) * a));
  return `rgb(${rgb})`;
}
// Punto y derivada de una Bézier cúbica en t (0..1)
function bz(p, t) { const u = 1 - t; return [u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6], u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]]; }
function dv(p, t) { const u = 1 - t; return [3*u*u*(p[2]-p[0])+6*u*t*(p[4]-p[2])+3*t*t*(p[6]-p[4]), 3*u*u*(p[3]-p[1])+6*u*t*(p[5]-p[3])+3*t*t*(p[7]-p[5])]; }
const dCurva = p => `M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}`;
const dPuntos = pts => pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join('');
// Puntos de la curva desplazados en perpendicular (para hilos paralelos y trenzas)
function desplazada(p, f) {
  const out = [];
  for (let i = 0; i <= 60; i++) {
    const t = i / 60, q = bz(p, t), v = dv(p, t), l = Math.hypot(v[0], v[1]), o = f(t);
    out.push([q[0] - v[1] / l * o, q[1] + v[0] / l * o]);
  }
  return out;
}
// Prolonga una curva en línea recta hacia fuera de la escena (260 unidades), para que
// el hilo entre desde el borde de la pantalla sea cual sea su tamaño
function conEntrada(p) {
  const dx = p[0] - p[2], dy = p[1] - p[3], l = Math.hypot(dx, dy);
  const x0 = p[0] + dx / l * 260, y0 = p[1] + dy / l * 260;
  return { d: `M${x0.toFixed(1)},${y0.toFixed(1)} L${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}`, extra: 260 };
}
// Hilo con puntadas (línea discontinua gruesa)
function puntada(d, color, padre) {
  return el('path', { d, fill:'none', stroke:color, 'stroke-width':4, 'stroke-dasharray':'9 6', 'stroke-linecap':'round' }, padre);
}

/* --- Animación ---------------------------------------------------------- */
// «Borda» un grupo: una máscara con un trazo que avanza a lo largo de la curva
function bordar(grupo, d, ancho, retardo, duracion) {
  const id = 'm' + Math.random().toString(36).slice(2, 8) + SUF;
  const mascara = el('mask', { id, maskUnits:'userSpaceOnUse', x:-700, y:-700, width:2080, height:1900 }, defs);
  const guia = el('path', { d, fill:'none', stroke:'#fff', 'stroke-width':ancho, 'stroke-linecap':'round' }, mascara);
  grupo.setAttribute('mask', `url(#${id})`);
  if (SIN_ANIMACION) return;
  const L = guia.getTotalLength() + 2;
  guia.setAttribute('stroke-dasharray', L);
  guia.style.strokeDashoffset = L;
  guia.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }],
               { duration: duracion, delay: retardo, easing: 'linear', fill: 'forwards' });
}
// Aparición con «salto» (para zurcidos y botones)
function aparecer(elemento, retardo, desde = .2) {
  if (SIN_ANIMACION) return;
  elemento.style.transformBox = 'fill-box';
  elemento.style.transformOrigin = 'center';
  elemento.animate([{ opacity: 0, transform: `scale(${desde})` },
                    { opacity: 1, transform: 'scale(1.12)', offset: .7 },
                    { opacity: 1, transform: 'scale(1)' }],
                   { duration: 380, delay: retardo, easing: 'ease-out', fill: 'backwards' });
}

/* =========================================================================
   3. PIEZAS
   ========================================================================= */
// Zurcido de cada colectivo: círculo bordado con relleno según su tipo
function zurcido(cx, cy, c, tipo, padre) {
  const g = el('g', {}, padre);
  el('circle', { cx, cy, r:16, fill:C.papel, stroke:c, 'stroke-width':3.5, 'stroke-dasharray':'6 4' }, g);
  if (tipo === 'espiral') {
    const pts = [], n = 5.2 * 2 * Math.PI;
    for (let a = 0; a <= n; a += .25) pts.push([cx + (2 + a*10/n) * Math.cos(a), cy + (2 + a*10/n) * Math.sin(a)]);
    el('path', { d:dPuntos(pts), fill:'none', stroke:c, 'stroke-width':2, 'stroke-dasharray':'4 2.5', 'stroke-linecap':'round' }, g);
    el('circle', { cx, cy, r:2.4, fill:mezcla(c, false, .4) }, g);
  }
  if (tipo === 'sol') {
    el('circle', { cx, cy, r:5, fill:mezcla(c, false, .4) }, g);
    for (let k = 0; k < 18; k++) {
      const a = k * Math.PI / 9;
      el('line', { x1:cx+7*Math.cos(a), y1:cy+7*Math.sin(a), x2:cx+11.5*Math.cos(a), y2:cy+11.5*Math.sin(a),
                   stroke: k % 2 ? mezcla(c, true, .35) : c, 'stroke-width':2, 'stroke-linecap':'round' }, g);
    }
  }
  if (tipo === 'anillos') {
    [4, 7.6, 11.2].forEach((r, i) => el('circle', { cx, cy, r, fill:'none', stroke: i === 1 ? mezcla(c, true, .5) : c,
      'stroke-width':2, 'stroke-dasharray':'3 2.4', 'stroke-linecap':'round' }, g));
  }
  if (tipo === 'rejilla') {
    const id = 'z' + Math.random().toString(36).slice(2, 8) + SUF;
    el('circle', { cx, cy, r:11.5 }, el('clipPath', { id }, defs));
    const gg = el('g', { 'clip-path':`url(#${id})` }, g);
    for (let y = -12; y <= 12; y += 3.2) el('line', { x1:cx-12, y1:cy+y, x2:cx+12, y2:cy+y, stroke:c, 'stroke-width':1.8 }, gg);
    for (let x = -12, i = 0; x <= 12; x += 3.2, i++) el('line', { x1:cx+x, y1:cy-12, x2:cx+x, y2:cy+12, stroke:mezcla(c, true, .45),
      'stroke-width':1.8, 'stroke-dasharray':'3.2 3.2', 'stroke-dashoffset': i % 2 ? 3.2 : 0 }, gg);
  }
  return g;
}
// Botón cosido de una alianza
function boton(a, padre) {
  const [cx, cy] = a.pos, g = el('g', {}, padre);
  el('circle', { cx, cy, r:19, fill:C.boton, stroke:C.tinta, 'stroke-width':2.5 }, g);
  el('circle', { cx, cy, r:14.5, fill:'none', stroke:C.tinta, 'stroke-width':1 }, g);
  const agujero = (x, y) => el('circle', { cx:x, cy:y, r:1.8, fill:C.tinta }, g);
  if (a.tipo === '#') {
    [[-4.5,-9,-4.5,9],[4.5,-9,4.5,9],[-9,-4.5,9,-4.5],[-9,4.5,9,4.5]].forEach((l, i) => {
      el('line', { x1:cx+l[0], y1:cy+l[1], x2:cx+l[2], y2:cy+l[3], stroke:a.colores[i], 'stroke-width':3, 'stroke-linecap':'round' }, g);
      agujero(cx+l[0], cy+l[1]); agujero(cx+l[2], cy+l[3]);
    });
  } else {
    a.angulos.forEach((ang, i) => {
      const r = ang * Math.PI / 180, dx = Math.cos(r) * 9, dy = Math.sin(r) * 9;
      el('line', { x1:cx-dx, y1:cy-dy, x2:cx+dx, y2:cy+dy, stroke:a.colores[i], 'stroke-width':3.5, 'stroke-linecap':'round' }, g);
      agujero(cx-dx, cy-dy); agujero(cx+dx, cy+dy);
    });
  }
  return g;
}
// Hilos de una alianza que siguen juntos, en paralelo.
// Cada hebra se registra con el id de su colectivo para poder resaltarla por separado.
function paralelo(curva, colores, ids, padre) {
  const n = colores.length;
  colores.forEach((c, i) => {
    const o = (i - (n-1)/2) * 10;
    registrar(puntada(dPuntos(desplazada(curva, () => o)), c, padre), [ids[i]]);
  });
}
// Hilos trenzados: cada tramo que «sube» pasa por delante dejando un hueco de papel
function trenza(curva, colores, ids, vueltas, padre) {
  const n = colores.length, hebras = [];
  colores.forEach((c, i) => {
    const fase = 2 * Math.PI * i / n;
    const pts = desplazada(curva, t => 7 * Math.sin(2*Math.PI*vueltas*t + fase) * Math.min(1, t*5));
    const delante = [];
    for (let k = 0; k <= 60; k++) delante.push(Math.cos(2*Math.PI*vueltas*k/60 + fase) >= 0);
    const tramos = []; let s = 0;
    for (let k = 1; k <= 60; k++) if (delante[k] !== delante[k-1]) { tramos.push([s, k, delante[k-1]]); s = k; }
    tramos.push([s, 60, delante[60]]);
    hebras.push({ pts, tramos, c, id: ids[i] });
  });
  [false, true].forEach(arriba => hebras.forEach(h => h.tramos.forEach(r => {
    if (r[2] !== arriba) return;
    const d = dPuntos(h.pts.slice(r[0], r[1] + 1));
    // Los tramos se dibujan en orden (primero los de abajo, luego los de encima) para que el
    // cruce sea real; cada tramo se registra con su colectivo para resaltarlo por separado
    if (arriba) registrar(el('path', { d, fill:'none', stroke:C.papel, 'stroke-width':9 }, padre), [h.id]);
    registrar(el('path', { d, fill:'none', stroke:h.c, 'stroke-width':4, 'stroke-linecap':'round' }, padre), [h.id]);
  })));
}

/* --- Logo: cinta tejida en espiga + etiqueta cosida ---------------------- */
function logo(padre, retardo) {
  const bd = el('g', { transform:'translate(340,245) rotate(-20)' }, padre);
  const PAL = [C.morado, C.celeste, C.fucsia, C.verde, C.naranja, C.lima, C.azul, C.mostaza, C.rojo, C.turquesa, C.papel, '#F6B5CF'];
  const colorA = [C.rojo, C.naranja, C.mostaza, C.lima, C.verde, C.turquesa, C.celeste, C.azul, C.morado, C.fucsia];

  // Flecos a los dos lados
  const flecos = el('g', {}, bd);
  for (let lado = -1; lado <= 1; lado += 2) for (let fy = -53, fn = 0; fy <= 53; fy += 2.7, fn++) {
    const fc = PAL[(fn*5 + (lado > 0 ? 3 : 0)) % 12], fj = Math.sin(fn*2.3) * 5, largo = 18 + ((fn*7) % 9) + Math.abs(fj);
    el('path', { d:`M${lado*96},${fy} Q${lado*(96+largo*.6)},${fy+fj*.6} ${lado*(96+largo)},${fy+fj*2.2}`,
                 fill:'none', stroke:fc, 'stroke-width':2.2, 'stroke-linecap':'round' }, flecos);
  }

  // Cinta: fondo negro + celosía. Cada mitad (arriba/abajo de la espiga) se dibuja recortada aparte
  const cinta = el('g', {}, bd);
  el('rect', { x:-105, y:-55, width:210, height:110, fill:C.fondoTejido }, cinta);
  const recorte = (nombre, y, h) => { const id = nombre + SUF; el('rect', { x:-105, y, width:210, height:h }, el('clipPath', { id }, defs)); return `url(#${id})`; };
  const cArriba = recorte('cArriba', -55, 55), cAbajo = recorte('cAbajo', -0.75, 55.75);
  const M = .7, D = 17, W = 8.5, A0 = -150, NN = 19, H = 55, NR = Math.sqrt(1 + M*M), EX = 12;
  const linea = (p, x1, y1, x2, y2, c) => {
    el('line', { x1, y1, x2, y2, stroke:'rgba(0,0,0,.5)', 'stroke-width':W + 1.6 }, p);
    el('line', { x1, y1, x2, y2, stroke:c, 'stroke-width':W }, p);
  };
  [-1, 1].forEach(hs => {
    const g = el('g', { 'clip-path': hs < 0 ? cArriba : cAbajo }, cinta);
    for (let i = 0; i < NN; i++) { const a = A0 + i*D; linea(g, a + M*EX, -hs*EX, a - M*(H+EX), hs*(H+EX), colorA[i % colorA.length]); }
    for (let j = 0; j < NN; j++) { const b = A0 + D/2 + j*D; linea(g, b - M*EX, -hs*EX, b + M*(H+EX), hs*(H+EX), CLAROS[j % CLAROS.length]); }
    // Cruces en los que el hilo de color pasa por encima (alternando, como un tejido real)
    for (let i = 0; i < NN; i++) for (let j = 0; j < NN; j++) {
      const a = A0 + i*D, b = A0 + D/2 + j*D; if (a <= b) continue;
      const yy = (a - b) / (2*M); if (yy > H + 8) continue;
      const encima = hs < 0 ? (i + j) % 2 === 0 : (i + j) % 2 === 1; if (!encima) continue;
      const y = hs*yy, px = a - M*yy, dx = -hs*M/NR, dy = 1/NR, h = 7;
      linea(g, px - dx*h, y - dy*h, px + dx*h, y + dy*h, colorA[i % colorA.length]);
    }
  });
  el('rect', { x:-105, y:-55, width:210, height:110, fill:'none', stroke:C.tinta, 'stroke-width':1.2, opacity:.6 }, cinta);

  // Etiqueta cosida con el nombre
  const etiqueta = el('g', {}, bd);
  el('rect', { x:-66, y:-23, width:132, height:46, fill:C.papel, stroke:C.tinta, 'stroke-width':2 }, etiqueta);
  el('rect', { x:-62, y:-19, width:124, height:38, fill:'none', stroke:C.tinta, 'stroke-width':1, 'stroke-dasharray':'3 3' }, etiqueta);
  const texto = el('text', { x:0, y:9, 'text-anchor':'middle', 'font-size':26, fill:C.tinta,
                             'font-family':"'Dela Gothic One', sans-serif", textLength:104, lengthAdjust:'spacingAndGlyphs' }, etiqueta);
  texto.textContent = 'TRAMA';

  if (!SIN_ANIMACION) {
    // La cinta se despliega desde el centro, luego salen los flecos y por último se cose la etiqueta
    cinta.style.transformBox = 'fill-box'; cinta.style.transformOrigin = 'center';
    cinta.animate([{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }],
                  { duration:T.tejido, delay:retardo, easing:'cubic-bezier(.2,.7,.2,1)', fill:'backwards' });
    flecos.animate([{ opacity:0 }, { opacity:1 }], { duration:300, delay:retardo + T.tejido*.7, fill:'backwards' });
    etiqueta.style.transformBox = 'fill-box'; etiqueta.style.transformOrigin = 'center';
    etiqueta.animate([{ opacity:0, transform:'scale(1.35)' }, { opacity:1, transform:'scale(.96)', offset:.75 }, { opacity:1, transform:'scale(1)' }],
                     { duration:T.etiqueta, delay:retardo + T.tejido*.85, easing:'ease-out', fill:'backwards' });
  }
  return bd;
}

/* =========================================================================
   4. MONTAJE DE LA ESCENA
   ========================================================================= */
let capas = [];   // [{ elemento, claves:Set }] para el resaltado al pulsar

function registrar(elemento, claves) { elemento.classList.add('capa'); capas.push({ elemento, claves: new Set(claves) }); }

function montar() {
  lienzo.innerHTML = '';
  capas = [];
  defs = el('defs', {});
  el('rect', { x:-400, y:-400, width:1480, height:1300, fill:C.papel });   // fondo (cubre aunque se recorte)

  const capaHilos = el('g', {}), capaAlianzas = el('g', {}), capaNodos = el('g', {}), capaBotones = el('g', {}), capaLogo = el('g', {});
  const finHilo = {};   // momento en que termina de bordarse cada colectivo

  // 4.1 Colectivos: hilo + zurcido
  COLECTIVOS.forEach((k, i) => {
    const retardo = T.inicio + i * T.escalonado;
    const g = el('g', {}, capaHilos);
    const entrada = conEntrada(k.curva);
    const hilo = puntada(entrada.d, k.color, g);
    bordar(g, entrada.d, 14, retardo, T.hilo);
    registrar(g, [k.id]);   // el hilo solo se enciende con su propio colectivo

    // El zurcido aparece cuando el bordado llega a su posición en el hilo
    const largoTotal = hilo.getTotalLength();
    const largoCurva = largoTotal - entrada.extra;
    const llegaZurcido = (entrada.extra + largoCurva * k.tr) / largoTotal;
    const [x, y] = bz(k.curva, k.tr);
    const z = zurcido(x, y, k.color, k.zurcido, capaNodos);
    z.classList.add('clicable');
    z.addEventListener('click', e => { e.stopPropagation(); resaltar(new Set([k.id, k.al, 'logo'])); });
    aparecer(z, retardo + T.hilo * llegaZurcido);
    registrar(z, [k.id]);
    finHilo[k.id] = retardo + T.hilo;
  });

  // 4.2 Alianzas: botón + tramo hasta el logo (paralelo o trenzado)
  let finAlianzas = Math.max(...Object.values(finHilo));
  for (const id in ALIANZAS) {
    const a = ALIANZAS[id];
    const llegada = Math.max(...COLECTIVOS.filter(k => k.al === id).map(k => finHilo[k.id]));
    const g = el('g', {}, capaAlianzas);
    const ids = COLECTIVOS.filter(k => k.al === id).map(k => k.id);
    if (a.sigue === 'paralelo') paralelo(a.curva, a.colores, ids, g); else trenza(a.curva, a.colores, ids, a.vueltas, g);
    bordar(g, dCurva(a.curva), 40, llegada, T.alianza);

    const b = boton(a, capaBotones);
    b.classList.add('clicable');
    b.addEventListener('click', e => {
      e.stopPropagation();
      resaltar(new Set([id, 'logo', ...COLECTIVOS.filter(k => k.al === id).map(k => k.id)]));
    });
    aparecer(b, llegada - 120, .4);
    registrar(b, [id]);
    finAlianzas = Math.max(finAlianzas, llegada + T.alianza);
  }

  // 4.3 Logo, cuando han llegado todos los hilos
  const lg = logo(capaLogo, finAlianzas - 250);
  lg.classList.add('clicable');
  lg.addEventListener('click', e => { e.stopPropagation(); quitarResaltado(); });
  registrar(capaLogo, ['logo']);
}

/* --- Resaltado: lo que no pertenece a la selección se atenúa ------------ */
function resaltar(activas) {
  capas.forEach(c => { c.elemento.style.opacity = [...c.claves].some(k => activas.has(k)) ? 1 : .15; });
}
function quitarResaltado() { capas.forEach(c => c.elemento.style.opacity = 1); }

// Pulsar en el fondo quita el resaltado; el botón vuelve a tejerlo todo
lienzo.addEventListener('click', quitarResaltado);
document.getElementById('replay').addEventListener('click', montar);

montar();
</script>
