<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sin esto, en un Notion oscuro el recuadro se pinta con fondo blanco opaco; así queda transparente en claro y en oscuro -->
<meta name="color-scheme" content="light dark">
<title>Trama · puntadas x (der)</title>
<style>
  /* Fondo transparente por defecto: se ve el color de la página que lo contiene. Con ?fondo=papel se pinta el crema. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  svg {
    display: block; width: 100%; height: 100%;
    /* Desvanece los dos extremos para que la línea parezca salir del margen y no se note un corte seco */
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
  }
</style>
</head>
<body>
<svg id="lienzo" aria-hidden="true"></svg>

<script>
/* =========================================================================
   TRAMA · hilera de puntadas en cruz que se cose sola.

   Cada puntada es una cruz hecha con 2 hilos de distinto color (X) o una
   estrella de 3 hilos (asterisco). Cada hilo se cose uno detrás de otro y las
   cruces se van haciendo de izquierda a derecha; un poco por detrás se van
   descosiendo. Un «hueco» recorre la hilera sin parar y la hilera nunca queda
   vacía (misma idea que la franja vertical de hilos).

   Parámetros por URL (todos opcionales), p. ej.:
     cosido.html?forma=asterisco&dir=izq&ritmo=350&colores=morado,naranja,celeste
   ========================================================================= */

/* ---------- 1. CONFIGURACIÓN ---------- */
// PALETA: copia exacta del bloque COLORES de cabecera.html y de las franjas verticales.
// Para cambiar la paleta de Trama hay que cambiar los mismos valores en todos los archivos.
const COLORES = {
  morado:  '#7A3FC4', verde:   '#2E9E5B', naranja: '#F28C28', rojo:    '#E63946',
  azul:    '#2B59C3', celeste: '#4FC3E8', fucsia:  '#E0218A', lima:    '#8BC53F',
  mostaza: '#F5C518', turquesa:'#12A89D',
  tinta:   '#1A1A1A', papel:   '#F5F0E6', boton:   '#EDE4D0', fondoTejido: '#241E2A'
};
// Colores de los hilos, en orden: se reparten de uno en uno por todos los hilos de la hilera
const POR_DEFECTO = ['azul', 'mostaza', 'morado', 'rojo', 'verde', 'naranja'];

const params  = new URLSearchParams(location.search);
const nombres = (params.get('colores') || POR_DEFECTO.join(',')).split(',')
  .map(s => s.trim()).filter(n => COLORES[n]);
let PALETA = (nombres.length ? nombres : POR_DEFECTO).map(n => COLORES[n]);
// ?color=rojo → todos los hilos del mismo color; admite un nombre de la paleta o un hex sin #
const UNICO = params.get('color');
if (UNICO) PALETA = [COLORES[UNICO] || (/^[0-9a-f]{3,8}$/i.test(UNICO) ? '#' + UNICO : COLORES.tinta)];

// VALORES POR DEFECTO de este archivo (los parámetros de la URL, si llegan, tienen prioridad):
//   forma: 'x' (2 hilos en cruz) | 'asterisco' (3 hilos) | 'linea' (1 hilo, puntada recta)
//   dir:   'der' (se cose de izquierda a derecha) | 'izq' (de derecha a izquierda)
const FORMA_POR_DEFECTO = 'x';
const DIR_POR_DEFECTO   = 'der';
const FORMA     = (params.get('forma') || FORMA_POR_DEFECTO).toLowerCase();
const IZQUIERDA = (params.get('dir') || DIR_POR_DEFECTO) === 'izq';   // 'izq' → se cose de derecha a izquierda
const RITMO     = parseFloat(params.get('ritmo')) || 280;      // ms entre una cruz y la siguiente (más alto = más lento)
const HUECO     = parseFloat(params.get('hueco')) || 2;        // nº de cruces descosidas a la vez (el «hueco» que recorre la hilera)
const RADIO     = parseFloat(params.get('tam')) || 10;         // medio tamaño de cada cruz (px)
const SEP       = parseFloat(params.get('sep')) || 14;         // espacio entre cruces (px)
const GROSOR    = parseFloat(params.get('grosor')) || 3.5;     // grosor del hilo (px)
const ONDA      = params.get('onda') !== null ? parseFloat(params.get('onda')) : 1.5;   // vaivén vertical (px), efecto «hecho a mano»

const FONDO = params.get('fondo');   // por defecto: transparente. ?fondo=papel → crema; ?fondo=191919 (hex sin #) → ese color
if (FONDO === 'papel') document.body.style.background = COLORES.papel;
if (FONDO && /^[0-9a-f]{3,8}$/i.test(FONDO)) document.body.style.background = '#' + FONDO;

/* ---------- 2. UTILIDADES ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
const lienzo = document.getElementById('lienzo');
const el = (tag, attrs, padre) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
};

// Hilos que forman una puntada: cada uno es [x1, y1, x2, y2] respecto al centro de la cruz.
// Se cosen en este orden, así el segundo hilo pasa por encima del primero.
function hilosDeUnaPuntada() {
  const a = RADIO;
  if (FORMA === 'linea') return [[-a, 0, a, 0]];
  if (FORMA === 'asterisco' || FORMA === '*') {
    // tres hilos que se cruzan en el centro, cada uno a 60° del anterior
    return [90, 30, -30].map(g => {
      const c = Math.cos(g * Math.PI / 180), s = Math.sin(g * Math.PI / 180);
      return [-a * c, -a * s, a * c, a * s];
    });
  }
  return [[-a, -a, a, a], [-a, a, a, -a]];   // X: dos diagonales
}

/* ---------- 3. MONTAJE ---------- */
const SIN_ANIMACION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const FIJO = params.get('t');          // ?t=3 congela la animación en el segundo 3 (para pruebas)
let animaciones = [];
let anchoMontado = -1;

function montar() {
  animaciones.forEach(a => a.cancel()); animaciones = [];
  lienzo.innerHTML = '';
  const W = lienzo.clientWidth, H = lienzo.clientHeight;
  if (!W || !H) return;
  anchoMontado = W;
  lienzo.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const hilos = hilosDeUnaPuntada();
  const PASO = 2 * RADIO + SEP;                                  // distancia entre centros de cruces
  const N = Math.max(1, Math.floor((W + SEP) / PASO));           // cuántas caben
  const x0 = (W - (N * PASO - SEP)) / 2 + RADIO;                 // centro de la primera (la hilera queda centrada)
  const cy = H / 2;
  const r = GROSOR / 2;

  // Tiempos (ms). T = lo que tarda el hueco en recorrer toda la hilera.
  const T  = Math.max(N, HUECO + 4) * RITMO;
  const D  = RITMO * 0.8;                // lo que tarda en coserse cada hilo
  const E  = RITMO * 0.8;                // lo que tarda en descoserse
  const Hh = HUECO * RITMO;              // tiempo que la cruz permanece descosida
  const SUB = RITMO * 0.45;              // cada hilo de la cruz arranca un poco después del anterior

  for (let i = 0; i < N; i++) {
    const orden = IZQUIERDA ? N - 1 - i : i;                     // orden en que se cose (0 = la primera)
    const cx = x0 + i * PASO;
    const y = cy + ONDA * Math.sin(i * 1.1);                     // pequeño vaivén: parece cosido a mano
    hilos.forEach((h, j) => {
      const color = PALETA[(orden * hilos.length + j) % PALETA.length];
      const p = el('path', {
        d: `M${(cx + h[0]).toFixed(1)},${(y + h[1]).toFixed(1)} L${(cx + h[2]).toFixed(1)},${(y + h[3]).toFixed(1)}`,
        fill: 'none', stroke: color, 'stroke-width': GROSOR, 'stroke-linecap': 'round'
      }, lienzo);
      const L = p.getTotalLength();
      // Para ocultar del todo un trazo con extremos redondeados hay que desplazar el patrón de guiones
      // más allá de su largo más el radio de los extremos
      const oculto = L + 2 * r + 1;
      const hueco  = L + 4 * r + 2;
      p.setAttribute('stroke-dasharray', `${L} ${hueco}`);
      p.setAttribute('stroke-dashoffset', 0);
      if (SIN_ANIMACION && FIJO === null) return;                // sin movimiento: todo cosido

      // Ciclo de un hilo: se cose (D), queda a la vista, se descose (E) y espera descosido (Hh).
      // El retardo escalona las cruces (una RITMO por detrás de la anterior) y los hilos dentro de cada cruz.
      const kf = [
        { strokeDashoffset: oculto,  offset: 0 },
        { strokeDashoffset: 0,       offset: D / T },
        { strokeDashoffset: 0,       offset: (T - Hh - E) / T },
        { strokeDashoffset: -oculto, offset: (T - Hh) / T },
        { strokeDashoffset: -oculto, offset: 1 }
      ];
      const a = p.animate(kf, { duration: T, delay: orden * RITMO + j * SUB, iterations: Infinity, easing: 'linear', fill: 'backwards' });
      if (FIJO !== null) { a.pause(); a.currentTime = parseFloat(FIJO) * 1000; }   // fotograma fijo para pruebas
      animaciones.push(a);
    });
  }
}

montar();
let temporizador;
// Solo se vuelve a montar si cambia el ANCHO: en el móvil la barra del navegador cambia la altura al
// hacer scroll y no queremos que la animación se reinicie por eso.
window.addEventListener('resize', () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { if (lienzo.clientWidth !== anchoMontado) montar(); }, 200);
});
</script>
</body>
</html>
